<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,
        td {
            border-collapse: collapse;
            padding: 20px;
            background-color: bisque;
        }

        caption {
            background-color: rgb(10, 163, 117);
            border: 2px;

        }
    </style>
</head>

<body>
    <h3>From with Structure</h3>

    <form action="">
        <table>
            <caption>Login Form</caption>
            <tr>
                <td>Email</td>
                <td> <input type="text" name="Email" placeholder="Enter Your Mail"></td>

            </tr>
            <tr>
                <td>Password</td>
                <td><input type="Password" name="Password" placeholder="Enter Password">
                </td>
            </tr>


        </table>
        <tr>
            <td></td>
            <input type="submit" value="Login">
        </tr>
    </form>
</body>

</html>
